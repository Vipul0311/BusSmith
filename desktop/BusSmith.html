<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BusSmith</title>
<style>
:root{--bar:#5da12b;--barfg:#fff;--bg:#e9ecef;--panel:#fff;--panel2:#f5f7f9;--b:#d3d8df;--tx:#1d2330;--mut:#6b7280;--acc:#3f8a1f;--accfg:#fff;--sel:#dcefd0;--hov:#eef5e8;--danger:#c0392b;--ok:#2a9d4a;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.btn{padding:3px 10px;border:1px solid var(--b);border-radius:3px;background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--acc);background:var(--hov)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.tb{border:0;background:none;padding:4px 9px;cursor:pointer;border-radius:3px;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--hov)}
.tb:disabled{opacity:.4;cursor:default}
input,select,textarea{padding:3px 6px;border:1px solid var(--b);border-radius:3px;background:var(--panel)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--acc);border-color:var(--acc)}
.mut{color:var(--mut)}.mono{font-family:ui-monospace,Consolas,monospace}.pad{padding:10px}.sp{flex:1}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#4a8a22,#7bbd4a);display:flex;align-items:center;justify-content:center;z-index:100}
.lcard{background:#fff;border-radius:8px;padding:26px 30px;width:360px;box-shadow:0 12px 40px #0004}
.lcard h1{margin:0 0 2px;letter-spacing:.12em;color:var(--acc);font-size:26px}
.lcard label{display:block;margin-top:12px;color:var(--mut)}
.lcard input{display:block;width:100%;margin-top:3px;padding:7px 9px;color:var(--tx)}
.lcard .btn{width:100%;margin-top:18px;padding:8px}
#lerr{color:var(--danger);min-height:1.3em;margin-top:8px}
/* app layout */
#app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh}
.titlebar{display:flex;align-items:stretch;background:var(--bar);color:var(--barfg);min-height:40px}
.brand{display:flex;align-items:center;padding:0 14px;font-weight:700;letter-spacing:.14em;font-size:16px;border-right:1px solid #ffffff40}
.ptitle{display:flex;flex-direction:column;justify-content:center;padding:0 14px;min-width:150px}
.ptitle b{font-size:13px;line-height:1.1}.ptitle small{opacity:.85;font-size:11px}
.tabs{display:flex;align-items:flex-end;gap:2px;overflow:hidden;flex:0 1 auto}
.tab{display:flex;align-items:center;gap:8px;background:#ffffff30;padding:6px 12px;border-radius:5px 5px 0 0;cursor:pointer;max-width:220px;white-space:nowrap}
.tab small{opacity:.85}
.tab.on{background:#fff;color:var(--tx)}
.tab b{cursor:pointer;opacity:.7;font-weight:400}.tab b:hover{opacity:1}
.titlebar .tb{color:#fff;font-size:16px;align-self:center}
.titlebar .tb:hover{background:#ffffff30}
.toolbar{display:flex;gap:2px;align-items:center;padding:3px 8px;background:var(--panel);border-bottom:1px solid var(--b);min-height:34px}
.crumbs{color:var(--mut);padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:42vw}
.crumbs b{color:var(--tx);font-weight:600}
.toolbar input#gwip{width:150px;margin-left:8px}
.pill{padding:1px 9px;border-radius:99px;border:1px solid var(--b);color:var(--mut);margin-left:4px}
.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.err{border-color:var(--danger);color:var(--danger)}
.dw{position:relative;display:inline-block}
.ddm{display:none;position:absolute;top:100%;left:0;min-width:230px;background:var(--panel);border:1px solid var(--b);box-shadow:0 8px 22px #0003;z-index:60;padding:3px 0}
.ddm.r{left:auto;right:0}.ddm.open{display:block}
.mi{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;cursor:pointer;position:relative;white-space:nowrap;gap:16px}
.mi:hover{background:var(--sel)}
.mi.dis{opacity:.45;pointer-events:none}
.mi .star{color:#c98a2b;cursor:pointer;padding:0 4px}
.mi.has>.sm{display:none;position:absolute;left:100%;top:-4px;min-width:230px;background:var(--panel);border:1px solid var(--b);box-shadow:0 8px 22px #0003;padding:3px 0}
.mi.has:hover>.sm{display:block}
.ctxm-x{}
#ctxm{position:fixed;z-index:300;min-width:300px;background:var(--panel);border:1px solid var(--b);box-shadow:0 8px 22px #0004;padding:3px 0;font-size:13.5px}#ctxm hr{border:0;border-top:1px solid var(--b);margin:3px 0}#ctxm .mi .mut{font-size:11.5px}.dca{border:1px solid var(--b);background:var(--panel)}.dtop{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--b)}.dtop b{margin-right:12px;font-size:16px}.dbody{display:flex}.dnav{width:190px;flex:none;border-right:1px solid var(--b)}.dnav h4{margin:0;padding:8px 10px;background:#eef2f6}.dnv{padding:7px 10px 7px 30px;cursor:pointer}.dnv.on{background:#3a8fe0;color:#fff}.dnv:hover:not(.on){background:var(--hov)}.dmain{flex:1;min-width:0;padding:8px}.dtb{display:flex;gap:6px;margin-bottom:8px;background:#dbe8f6;padding:6px}.dsplit{display:flex;gap:10px;align-items:flex-start}.dwrap{flex:1;max-height:58vh;overflow:auto;border:1px solid var(--b)}.dr.on{background:var(--sel)}.dr input,.dr select{width:100%}.dbus{width:240px;flex:none;border:1px solid var(--b);padding:8px}.dbl{list-style:none;margin:8px 0;padding:0;min-height:60px}.dbl li{padding:5px 6px;border:1px solid var(--b);margin-bottom:4px;cursor:grab;display:flex;justify-content:space-between}.dbl li.on{background:var(--sel)}
.ptb{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}.pbc{font-size:16px;margin:6px 0 10px}.psplit{display:flex;border:1px solid var(--b);background:var(--panel);min-height:300px}.ptree{width:300px;flex:none;border-right:1px solid var(--b);max-height:70vh;overflow:auto}.pch{padding:10px 12px;background:#eef2f6;cursor:pointer;border-bottom:1px solid var(--b);font-weight:500}.pm{display:inline-block;width:22px;color:#667}.ppg{padding:9px 12px 9px 40px;cursor:pointer}.ppg:hover{background:var(--hov)}.ppg.on{background:#fff;color:#2b7a1e;font-weight:600;box-shadow:inset 3px 0 #2b7a1e}.pbody{flex:1;min-width:0;max-height:70vh;overflow:auto;padding:10px 16px}.phd{color:#667;font-size:12.5px;margin-bottom:8px}.prow{display:flex;align-items:center;gap:16px;padding:5px 8px;border-bottom:1px solid #0000}.prow:hover{background:var(--hov)}.prow.chg{background:#fff3c4}.plb{flex:1}.pct{width:300px;flex:none;display:flex;justify-content:flex-end}.pct input[type=checkbox]{width:18px;height:18px}.pct select,.pct input:not([type=checkbox]){width:100%}
.ddm hr{border:0;border-top:1px solid var(--b);margin:3px 0}
.ddm .hd{padding:6px 14px;color:var(--mut);border-bottom:1px solid var(--b)}
.ws{display:grid;grid-template-columns:280px minmax(0,1fr) 310px;min-height:0}
.ws.noleft{grid-template-columns:0 minmax(0,1fr) 310px}.ws.noright{grid-template-columns:280px minmax(0,1fr) 0}.ws.noleft.noright{grid-template-columns:0 minmax(0,1fr) 0}
.ws.noleft #left,.ws.noright #right{display:none}
#left{display:flex;flex-direction:column;border-right:1px solid var(--b);background:var(--panel);min-height:0}
#lhead{display:flex;border-bottom:1px solid var(--b);background:var(--panel2)}
#lhead .lhb{flex:1;text-align:left;border:0;background:none;padding:8px 10px;font-weight:600;cursor:pointer}
#lhead .lhb:hover{background:var(--hov)}
#rail{border-bottom:1px solid var(--b)}
.rl{display:flex;align-items:center;padding:4px 10px;cursor:pointer;gap:6px}
.rl:hover{background:var(--hov)}.rl.on{background:var(--sel);font-weight:600}
.rl .star{margin-left:auto;color:#c98a2b}
.ltools{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--b)}
.ltools input{flex:1;min-width:0}
#tree{flex:1;overflow:auto;padding:3px 0}
.tn{display:flex;align-items:center;padding:2px 6px;cursor:default;white-space:nowrap}
.tn:hover{background:var(--hov)}.tn.on{background:var(--sel)}
.chev{width:14px;color:var(--mut);cursor:pointer;flex:none;text-align:center}
.lbl{overflow:hidden;text-overflow:ellipsis}
.ic{width:10px;height:10px;border-radius:2px;display:inline-block;margin:0 6px 0 2px;flex:none}
.ic.m{background:#3f8a1f}.ic.d{background:#4f8cc9}.ic.g{background:#c98a2b}.ic.a{background:#7b61c9}.ic.l{background:#5b8c3a}.ic.v{background:#c45a8a}.ic.b{background:#8a6d3b}.ic.f{background:#e0a030}.ic.r{background:#4a90a4}.ic.t{background:#6b7280}
#center{overflow:auto;padding:12px 16px;background:var(--panel2);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ch h2{margin:0;font-size:17px;font-weight:600}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--b)}
.tbl th{background:var(--panel2);text-align:left;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--b);white-space:nowrap}
.tbl td{padding:3px 8px;border-bottom:1px solid #e7eaee}
.tbl tr.click:hover{background:var(--hov);cursor:pointer}
.tbl input[type=text],.tbl input:not([type]),.tbl select{width:100%;min-width:70px;padding:1px 4px}
.scroll{overflow:auto}
.objt td{white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--b);border-radius:4px;padding:10px 12px;margin-bottom:12px}
.card h4{margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:160px 1fr;gap:4px 12px}
.kv div:nth-child(odd){color:var(--mut)}
.welcome{max-width:520px;margin:50px auto;text-align:center}
.empty{color:var(--mut);padding:14px;background:var(--panel);border:1px dashed var(--b);border-radius:4px}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--b);margin-bottom:10px}
.subtabs button{border:0;background:none;padding:6px 14px;cursor:pointer;border-bottom:2px solid transparent}
.subtabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
/* right pane */
#right{display:flex;flex-direction:column;border-left:1px solid var(--b);background:var(--panel);min-height:0}
#rhead{padding:8px 12px;font-weight:600;border-bottom:1px solid var(--b);background:var(--panel2)}
.ptabs{display:flex;border-bottom:1px solid var(--b)}
.ptabs button{flex:1;border:0;background:none;padding:6px 2px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#rbody{flex:1;overflow:auto;padding:10px 12px}
#rbody label{display:block;margin:8px 0 0;color:var(--mut);font-size:12px}
#rbody label input,#rbody label select,#rbody label textarea{display:block;width:100%;margin-top:2px;color:var(--tx);font-size:13px}
#rbody .ro{color:var(--tx);margin-top:2px}
#rlist{border-top:1px solid var(--b)}
.rli{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;color:var(--mut);border-top:1px solid #eef0f3}
.rli:hover{background:var(--hov)}.rli.on{background:var(--sel);color:var(--tx);font-weight:600}
.rli .cnt{margin-left:auto;background:var(--panel2);border-radius:99px;padding:0 7px;font-size:11px}
.li{padding:5px 0;border-bottom:1px solid #eef0f3}
.li.click{cursor:pointer}.li.click:hover{background:var(--hov)}
.li.cur{background:var(--sel)}
.cm{background:var(--panel2);border-radius:4px;padding:6px 8px;margin-bottom:6px}
.cm small{color:var(--mut)}
/* monitor */
.mbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.logwrap{height:calc(100vh - 290px);min-height:200px;overflow:auto;border:1px solid var(--b);background:var(--panel)}
.logwrap table{border-collapse:collapse;width:100%;font:12px ui-monospace,Consolas,monospace}
.logwrap th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:3px 8px;border-bottom:1px solid var(--b)}
.logwrap td{padding:1px 8px;border-bottom:1px solid #eef0f3;white-space:nowrap}
.logwrap tr.tx td{color:var(--acc)}
.logwrap td button{padding:0 6px}
.sb{display:flex;gap:18px;padding:3px 10px;background:var(--bar);color:#fff;font-size:12px}
dialog{border:1px solid var(--b);border-radius:8px;background:var(--panel);color:var(--tx);min-width:340px}
dialog label{display:block;margin:8px 0;color:var(--mut)}
dialog label input,dialog label select{display:block;width:100%;margin-top:2px;color:var(--tx)}
dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:12px 0 0}
#clist{border:1px solid var(--b);min-height:120px;max-height:260px;overflow:auto;background:var(--bg,#fff)}#cdlg{min-width:560px}.chead{padding:4px 8px;font-weight:600}.crow{display:flex;gap:10px;align-items:center;padding:5px 24px;cursor:pointer}.crow.on{background:#cfe3f7}.crow:hover{background:#e6f0fa}.cnone{padding:4px 24px}.cic{width:18px}#sdlg{width:min(1000px,96vw);height:min(640px,92vh);padding:0}.sform{display:flex;flex-direction:column;height:100%}.shead{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--b)}.shead h3{margin:0}.sbody{display:flex;flex:1;min-height:0}#snav{width:200px;flex:none;border-right:1px solid var(--b);overflow:auto}.snav{padding:10px 16px;cursor:pointer}.snav:hover{background:#e6f0fa}.snav.on{background:#cfe3f7;font-weight:600}#spage{flex:1;overflow:auto;padding:16px}.appsgrid{display:flex;gap:20px;align-items:flex-start}.appsgrid>.appl{flex:1;min-width:0}.appsgrid>.appr{width:200px;flex:none;display:flex;flex-direction:column;gap:8px}tr.arow{cursor:pointer}tr.arow.on{background:#cfe3f7}.okd{color:#2e8b2e}.wrn{color:#c98a2b}#adlg{width:min(1000px,96vw)}#adbody{max-height:66vh;overflow:auto;min-width:600px}.sec td{background:#eef2f6;font-weight:600}tr.cdiff td{background:#fff3cd}.chsplit{display:flex;gap:12px;align-items:flex-start}.chlist{width:250px;flex:none;border:1px solid var(--b);max-height:70vh;overflow:auto}.chitem{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--b)}.chitem.on{background:#cfe3f7}.chitem:hover{background:#e6f0fa}.chbody{flex:1;min-width:0}.cb{font-style:normal;background:#e6e6e6;border-radius:9px;padding:0 7px;margin-left:4px;font-size:11px}.prow{margin:2px 8px!important}
dialog menu.fdm{flex-direction:row-reverse;justify-content:flex-start}
#errbar{position:fixed;left:0;right:0;top:0;z-index:200;background:#b3261e;color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center}
#errbar span{flex:1}
#otext{width:min(720px,80vw);height:50vh;font:12px ui-monospace,Consolas,monospace}
@media print{.titlebar,.toolbar,#left,#right,.sb,.acts{display:none!important}body{overflow:visible}#app{display:block;height:auto}.ws{display:block}#center{overflow:visible}}
</style>
</head>
<body>
<div id="errbar" hidden><span id="errtxt"></span><button class="btn" id="errreset">Reset saved project data</button><button class="btn" id="errx">Dismiss</button></div>

<div id="login" hidden>
  <form class="lcard" id="lform" autocomplete="off">
    <h1>BusSmith</h1>
    <div class="mut" id="lsub">KNX project and diagnostics tool</div>
    <label>User ID<input id="lid" required></label>
    <label id="lrowname" hidden>Display name<input id="lname"></label>
    <label>Password<input id="lpw" type="password" required></label>
    <label id="lrowpw2" hidden>Repeat password<input id="lpw2" type="password"></label>
    <div id="lerr"></div>
    <button class="btn pri" id="lbtn">Log in</button>
    <p class="mut" style="margin:12px 0 0;font-size:12px" id="lnote"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="titlebar">
    <div class="brand">BusSmith</div>
    <div class="ptitle"><b id="tpname">Project</b><small id="tpsub"></small></div>
    <div class="tabs" id="tabs"></div>
    <button class="tb" id="tabnew" title="New tab">+</button>
    <div class="dw"><button class="tb" id="tablist" title="All tabs">&#8964;</button><div class="ddm"></div></div>
  </div>

  <div class="toolbar">
    <button class="tb" id="nback" title="Back">&#8592;</button>
    <button class="tb" id="nfwd" title="Forward">&#8594;</button>
    <div class="crumbs" id="crumbs"></div>
    <span class="sp"></span>
    <div class="dw"><button class="tb" id="badd">+ Add &#9662;</button><div class="ddm r"></div></div>
    <button class="tb" id="bren" title="Rename (F2)">&#9998; Rename</button>
    <button class="tb" id="bdel">&#10005; Delete</button>
    <button class="tb" id="bdl" disabled title="Download to devices is not available in this version">&#10515; Download</button>
    <button class="tb" id="bundo">&#8630; Undo</button>
    <div class="dw"><button class="tb" id="bpanels">&#9638; Panels &#9662;</button><div class="ddm r"></div></div>
    <input id="gwip" type="hidden">
    <button class="btn pri" id="mconn" title="Select the KNX interface (USB or ESP32)">Connect</button>
    <span class="pill" id="gstat">disconnected</span>
    <div class="dw"><button class="tb" id="buser" title="User">&#9786; &#9662;</button><div class="ddm r"></div></div>
    <button class="tb" id="bset" title="Settings (Ctrl+,)">&#9881;</button>
    <div class="dw"><button class="tb" id="bmore" title="More">&#8942;</button><div class="ddm r"></div></div>
  </div>

  <div class="ws" id="ws">
    <aside id="left">
      <div id="lhead"><div class="dw" style="flex:1;display:flex"><button class="lhb" id="lhbtn">Panel &#9662;</button><div class="ddm"></div></div><button class="tb" id="lclose" title="Hide panel">&#10005;</button></div>
      <div id="rail"></div>
      <div class="ltools"><input id="filter" placeholder="Search…"><button class="btn pri" id="addroot" title="Add">+</button></div>
      <div id="tree"></div>
    </aside>
    <section id="center"></section>
    <aside id="right">
      <div id="rhead"></div>
      <div id="rbody"></div>
      <div id="rlist"></div>
    </aside>
  </div>

  <div class="sb"><span id="sbmsg">Ready</span><span class="sp"></span><span id="sbsel"></span><span id="sbcount"></span><span id="sbuser"></span></div>
</div>

<dialog id="out"><form method="dialog">
  <h3 id="ot"></h3><textarea id="otext" readonly></textarea>
  <menu><button type="button" class="btn" id="ocopy">Copy</button><button type="button" class="btn" id="odl">Download</button><button class="btn" value="close">Close</button></menu>
</form></dialog>
<dialog id="fdlg"><form method="dialog">
  <h3 id="fdt"></h3><div id="fdbody"></div>
  <menu class="fdm"><button class="btn pri" value="ok">OK</button><button class="btn" value="cancel" formnovalidate>Cancel</button></menu>
</form></dialog>
<dialog id="cdlg"><form method="dialog">
  <h3>Select Connection</h3>
  <p class="mut" style="margin:0 0 8px">Choose the interface BusSmith should use to reach the KNX bus.</p>
  <div id="clist"></div>
  <p id="cwarn" class="mut" style="color:#c0392b"></p>
  <div class="row" style="margin-top:8px"><button type="button" class="btn" id="cfind">Find USB interface…</button><input id="cip" placeholder="ESP32 gateway IP, e.g. 192.168.1.50" style="flex:1"><button type="button" class="btn" id="cadd">Add</button></div>
  <label style="margin-top:10px"><input type="checkbox" id="cuse" checked style="display:inline;width:auto"> Use also for future connections</label>
  <menu class="fdm"><button class="btn pri" value="ok" id="cok">Connect</button><button class="btn" value="cancel" formnovalidate>Cancel</button></menu>
</form></dialog>
<dialog id="pdlg"><form method="dialog">
  <h3>Import product database</h3><p class="mut" id="pinfo" style="margin:0 0 8px"></p>
  <input id="pfilter" placeholder="Filter by name, order number or manufacturer…" style="width:100%">
  <div id="plist" style="max-height:320px;min-width:520px;overflow:auto;border:1px solid var(--b);margin:8px 0"></div>
  <div class="row"><button type="button" class="btn" id="pall">Select shown</button><button type="button" class="btn" id="pnone">Clear</button><span id="pcount" class="mut"></span></div>
  <menu class="fdm"><button class="btn pri" value="ok">Import selected</button><button class="btn" value="cancel" formnovalidate>Cancel</button></menu>
</form></dialog>
<dialog id="sdlg"><form method="dialog" class="sform">
  <div class="shead"><h3>&#9881; Settings</h3><button class="btn" value="close">Close</button></div>
  <div class="sbody"><nav id="snav"></nav><div id="spage"></div></div>
</form></dialog>
<dialog id="adlg"><form method="dialog">
  <h3 id="adt"></h3><div id="adbody"></div>
  <menu><button type="button" class="btn pri" id="adgo">Run</button><button class="btn" value="close">Close</button></menu>
</form></dialog>
<dialog id="udlg"><form method="dialog">
  <h3>Users</h3><div id="ulist"></div>

/* ================= users / login ================= */
const USERS_KEY='nlk.users';
const getUsers=()=>{try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]');}catch(e){return [];}};
const setUsers=u=>localStorage.setItem(USERS_KEY,JSON.stringify(u));
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return 'weak'+h;   // fallback only when WebCrypto is missing
}
let ME=null;
const canEdit=()=>!!ME&&ME.role!=='viewer';
function guard(){if(canEdit())return true;alert('You are logged in as a viewer. Ask an administrator for editor rights.');return false;}
function showLogin(){
  $('#app').hidden=true;$('#login').hidden=false;
  const first=!getUsers().length;
  $('#lrowname').hidden=!first;$('#lrowpw2').hidden=!first;
  $('#lbtn').textContent=first?'Create administrator':'Log in';
  $('#lsub').textContent=first?'First start: create the administrator account':'KNX project and diagnostics tool';
  $('#lnote').textContent=first?'This account is stored only in this browser.':'';
  $('#lerr').textContent='';$('#lpw').value='';$('#lpw2').value='';
}
$('#lform').onsubmit=async e=>{
  e.preventDefault();
  const id=$('#lid').value.trim(),pw=$('#lpw').value,err=m=>{$('#lerr').textContent=m;};
  const us=getUsers();
  if(!us.length){
    if(!id||pw.length<4)return err('Enter a user ID and a password of at least 4 characters.');
    if(pw!==$('#lpw2').value)return err('The passwords do not match.');
    const salt=uid()+uid();
    us.push({id,name:$('#lname').value.trim()||id,role:'admin',salt,hash:await hashPw(pw,salt)});
    setUsers(us);return enter(us[0]);
  }
  const u=us.find(x=>x.id.toLowerCase()===id.toLowerCase());
  if(!u||(await hashPw(pw,u.salt))!==u.hash)return err('Wrong user ID or password.');
  enter(u);
};
function enter(u){
  ME={id:u.id,name:u.name,role:u.role};
  sessionStorage.setItem('nlk.session',u.id);
  $('#login').hidden=true;$('#app').hidden=false;$('#lpw').value='';
  startApp();
}
function logout(){sessionStorage.removeItem('nlk.session');ME=null;closeMenus();showLogin();}

const PKEY='nlk.project';
function fixObj(x,i){
  x.num=x.num==null?i+1:x.num;x.name=x.name||'Object';x.func=x.func||'';x.len=x.len||'1 bit';
  if(x.flags==null)x.flags={s:'CRT',r:'CW',rw:'CRWT'}[x.dir]||'CRWT';
  delete x.dir;x.dpt=x.dpt||'';x.prio=x.prio||'Low';x.ga=x.ga||'';x.links=x.links||[];
}
function seedCatalog(){
  const O=(name,func,len,flags,dpt)=>({name,func,len,flags,dpt,prio:'Low',ga:'',links:[]});
  const rep=(n,f)=>{const r=[];for(let i=1;i<=n;i++)r.push(...f(i));return r;};
  const mk=(name,orderNo,desc,objs)=>({id:uid(),mfr:'Generic',name,orderNo,desc,objs});
  return [
    mk('Switch actuator 4-fold','GEN-SA4','4-channel switching actuator',rep(4,i=>[O(`Channel ${i}: Switch`,'On/Off','1 bit','CW','1.001'),O(`Channel ${i}: Status`,'Status','1 bit','CRT','1.001')])),
    mk('Push button 4-fold','GEN-PB4','4-button wall switch',rep(4,i=>[O(`Button ${i}: Switch`,'On/Off','1 bit','CT','1.001')])),
    mk('Dimmer actuator 2-fold','GEN-DA2','2-channel dimmer',rep(2,i=>[O(`Channel ${i}: Switch`,'On/Off','1 bit','CW','1.001'),O(`Channel ${i}: Dimming value`,'Absolute dimming','1 byte','CW','5.001'),O(`Channel ${i}: Status`,'Status','1 bit','CRT','1.001')])),
    mk('Blind actuator 2-fold','GEN-BA2','2-channel blind/shutter actuator',rep(2,i=>[O(`Channel ${i}: Move`,'Up/Down','1 bit','CW','1.008'),O(`Channel ${i}: Position`,'Absolute position','1 byte','CW','5.001'),O(`Channel ${i}: Position status`,'Status','1 byte','CRT','5.001')])),
    mk('Temperature sensor','GEN-TS1','Room temperature sensor',[O('Temperature','Temperature','2 bytes','CRT','9.001')])
  ];
}
function fix(p){
  p=p||{};p.name=p.name||'New project';p.number=p.number||'';p.client=p.client||'';p.desc=p.desc||'';p.cre=p.cre||now();p.creBy=p.creBy||'';
  p.mains=p.mains||[];
  p.mains.forEach(m=>{m.desc=m.desc||'';m.pass=m.pass||'No';m.comments=m.comments||[];m.mids=m.mids||[];m.mids.forEach(d=>{d.desc=d.desc||'';d.pass=d.pass||'No';d.comments=d.comments||[];d.gas=d.gas||[];d.gas.forEach(g=>{g.desc=g.desc||'';g.dpt=g.dpt||'';g.comments=g.comments||[];});});});
  p.topo=p.topo||{areas:[]};p.topo.areas=p.topo.areas||[];
  p.topo.areas.forEach(a=>{a.desc=a.desc||'';a.comments=a.comments||[];a.lines=a.lines||[];a.lines.forEach(l=>{l.desc=l.desc||'';l.comments=l.comments||[];l.devices=l.devices||[];l.devices.forEach(v=>{v.desc=v.desc||'';v.comments=v.comments||[];v.status=v.status||'Unknown';v.serial=v.serial||'';v.dl=v.dl||'';v.mfr=v.mfr||'';v.product=v.product||'';v.orderNo=v.orderNo||'';v.params=v.params||[];v.channels=v.channels||[];v.dca=v.dca||'';v.appId=v.appId||'';v.objs=v.objs||[];v.objs.forEach(fixObj);});});});
  p.build=p.build||[];
  const fb=n=>{n.id=n.id||uid();n.desc=n.desc||'';n.comments=n.comments||[];n.kids=n.kids||[];n.devs=n.devs||[];n.kids.forEach(fb);};p.build.forEach(fb);
  if(!p.catalog)p.catalog=seedCatalog();
  p.catalog.forEach(c=>{c.id=c.id||uid();c.desc=c.desc||'';c.mfr=c.mfr||'';c.orderNo=c.orderNo||'';c.comments=c.comments||[];c.objs=c.objs||[];c.params=c.params||[];c.channels=c.channels||[];c.dca=c.dca||'';c.appId=c.appId||'';c.objs.forEach(fixObj);});
  p.todos=p.todos||[];p.comments=p.comments||[];
  return p;
}

function index(){
  gaMap=new Map();gaByStr=new Map();gaParent=new Map();devMap=new Map();devByAddr=new Map();devParent=new Map();devLine=new Map();lineArea=new Map();linkMap=new Map();
  P.mains.forEach(m=>m.mids.forEach(d=>d.gas.forEach(g=>{const s=`${m.num}/${d.num}/${g.num}`;gaMap.set(g,s);gaByStr.set(s,g);gaParent.set(g,d.gas);})));

  devMap.forEach((s,v)=>v.objs.forEach(x=>{[x.ga,...x.links].filter(Boolean).forEach(g=>{if(!linkMap.has(g))linkMap.set(g,[]);linkMap.get(g).push({dev:v,obj:x});});}));
}
const allGA=()=>[...gaMap].map(([g,s])=>({ga:s,name:g.name,dpt:g.dpt}));
const allDevs=()=>[...devMap].map(([v,s])=>({addr:s,name:v.name,dev:v}));
function touch(o){if(o){o.mod=now();o.modBy=ME?ME.id:'';}}
function commit(label){
  let s=JSON.stringify(P);
  if(s!==hist[hi].s){
    P.modified=now();P.modBy=ME?ME.id:'';s=JSON.stringify(P);
    hist=hist.slice(0,hi+1);hist.push({s,label:label||'Change',time:now(),by:ME?ME.id:''});hi=hist.length-1;
    const cap=s.length>1500000?10:s.length>400000?40:150;while(hist.length>cap){hist.shift();hi--;}
  }
  try{localStorage.setItem(PKEY,s);}catch(e){try{msg('Project is too big to auto-save in the browser. Use ⋮ → Save project to file.');}catch(x){}}

function jump(i){

function renumber(fn){
  const oldG=new Map(gaMap),oldD=new Map(devMap);fn();index();
  const gm=new Map();oldG.forEach((s,o)=>{if(gaMap.has(o))gm.set(s,gaMap.get(o));});
  const dm=new Map();oldD.forEach((s,o)=>{if(devMap.has(o))dm.set(s,devMap.get(o));});
  devMap.forEach(v=>v.objs.forEach(x=>{if(x.ga&&gm.has(x.ga))x.ga=gm.get(x.ga);x.links=x.links.map(l=>gm.get(l)||l);}));
  const fb=n=>{n.devs=n.devs.map(a=>dm.get(a)||a);n.kids.forEach(fb);};P.build.forEach(fb);
  index();
}
function cleanup(){
  index();
  devMap.forEach(v=>v.objs.forEach(x=>{if(x.ga&&!gaByStr.has(x.ga))x.ga='';x.links=x.links.filter(l=>gaByStr.has(l));}));
  const fb=n=>{n.devs=n.devs.filter(a=>devByAddr.has(a));n.kids.forEach(fb);};P.build.forEach(fb);
}
function nextNum(arr,max,start){const u=new Set(arr.map(x=>x.num));for(let i=start||0;i<=max;i++)if(!u.has(i))return i;return -1;}
function addTo(arr,max,obj,start){const n=nextNum(arr,max,start);if(n<0){alert('No free number left here.');return null;}obj.num=n;obj.cre=now();arr.push(obj);arr.sort(byNum);return obj;}

/* ================= value decode / encode ================= */
function dpt9(h,l){let m=((h&7)<<8)|l;if(h&0x80)m-=2048;return 0.01*m*(1<<((h>>3)&15));}
function enc9(v){let m=Math.round(v*100),e=0;while(m<-2048||m>2047){m=Math.round(m/2);e++;}const h=((m<0)?0x80:0)|(e<<3)|((m>>8)&7),l=m&255;return h.toString(16).padStart(2,'0')+l.toString(16).padStart(2,'0');}
function decodeVal(dpt,b){
  if(!dpt||!b.length)return '';
  const [m,s]=dpt.split('.');
  if(m==='1'){const lab={'001':['Off','On'],'002':['False','True'],'008':['Up','Down'],'009':['Open','Close']}[s]||['0','1'];return lab[b[0]&1];}
  if(m==='3'&&b.length===1){const v=b[0]&15;return (v&8?'Increase':'Decrease')+((v&7)?' step '+(v&7):' (stop)');}
  if(m==='5'&&b.length===1)return s==='001'?Math.round(b[0]*100/255)+' %':String(b[0]);
  if(m==='7'&&b.length===2)return ((b[0]<<8)|b[1])+({'600':' K','005':' s'}[s]||'');
  if(m==='9'&&b.length===2){const u={'001':' °C','004':' lx','007':' %'}[s]||'';return dpt9(b[0],b[1]).toFixed(2)+u;}
  if(m==='14'&&b.length===4){const dv=new DataView(new Uint8Array(b).buffer);return dv.getFloat32(0).toFixed(2)+(s==='056'?' W':'');}
  if(m==='17'&&b.length===1)return 'Scene '+((b[0]&63)+1);
  if(m==='232'&&b.length===3)return '#'+b.map(x=>x.toString(16).padStart(2,'0')).join('');
  return '';
}
function encodeVal(dpt,val){
  val=String(val).trim();
  if(dpt==='5.001'){const v=Math.max(0,Math.min(100,parseFloat(val)));if(isNaN(v))return null;return 'b '+Math.round(v*255/100).toString(16).padStart(2,'0');}
  if(dpt&&dpt.startsWith('7.')){const v=Math.round(parseFloat(val));if(isNaN(v)||v<0||v>65535)return null;return 'b '+v.toString(16).padStart(4,'0');}
  if(dpt&&dpt.startsWith('9.')){const v=parseFloat(val);if(isNaN(v))return null;return 'b '+enc9(v);}
  if(dpt==='17.001'){const v=parseInt(val,10);if(isNaN(v)||v<1||v>64)return null;return 'b '+(v-1).toString(16).padStart(2,'0');}
  const hx=val.replace(/[^0-9a-f]/gi,'');if(!hx||hx.length%2)return null;return 'b '+hx;
}

/* ================= favourites, tabs, navigation ================= */
const favKey=()=>'nlk.fav.'+(ME?ME.id:'');
let favs=['build','ga','topo','diag'];
function loadFavs(){try{const f=JSON.parse(localStorage.getItem(favKey())||'null');if(Array.isArray(f))favs=f.filter(x=>PTITLE[x]);else favs=['build','ga','topo','diag'];}catch(e){favs=['build','ga','topo','diag'];}}
function saveFavs(){localStorage.setItem(favKey(),JSON.stringify(favs));}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFavs();renderLeftHead();if(menuBuilder)refreshMenu();}

let tabs=[{id:uid(),panel:'ga',sel:null,devtab:'ch'}],ti=0;
function saveTab(){const t=tabs[ti];t.panel=mode;t.sel=sel;t.devtab=devtab;}
function loadTab(i){ti=i;const t=tabs[i];mode=t.panel;sel=t.sel;devtab=t.devtab||'ch';renderAll();}
function switchTab(i){if(i===ti||!tabs[i])return;saveTab();loadTab(i);}
function newTab(panel){saveTab();tabs.push({id:uid(),panel:panel||mode,sel:null,devtab:'ch'});ti=tabs.length-1;if(panel)mode=panel;setPanel(mode);}
function closeTab(i){if(tabs.length<2)return;saveTab();tabs.splice(i,1);ti=Math.min(i<ti?ti-1:ti,tabs.length-1);loadTab(ti);}
function renderTabs(){
  $('#tabs').innerHTML=tabs.map((t,i)=>`<div class="tab ${i===ti?'on':''}" data-ti="${i}"><span>${esc(P.name)}</span><small>${esc(PTITLE[i===ti?mode:t.panel])}</small>${tabs.length>1?`<b data-tc="${i}">&#10005;</b>`:''}</div>`).join('');
  $('#tpname').textContent=P.name;$('#tpsub').textContent=PTITLE[mode];
}
$('#tabs').addEventListener('click',e=>{const c=e.target.closest('[data-tc]');if(c){closeTab(+c.dataset.tc);return;}const t=e.target.closest('[data-ti]');if(t)switchTab(+t.dataset.ti);});
$('#tabnew').onclick=()=>newTab();

let nav=[],ni=-1,navigating=false;
function navPush(){if(navigating)return;nav=nav.slice(0,ni+1);nav.push({mode,sel});ni=nav.length-1;if(nav.length>80){nav.shift();ni--;}}
function navGo(d){const j=ni+d;if(j<0||j>=nav.length)return;ni=j;navigating=true;mode=nav[j].mode;sel=nav[j].sel;renderAll();navigating=false;}
$('#nback').onclick=()=>navGo(-1);$('#nfwd').onclick=()=>navGo(1);

const mfrCache=new Map();const mfrObj=n=>{if(!mfrCache.has(n))mfrCache.set(n,{name:n});return mfrCache.get(n);};
function treeData(){
  const dv=(v,from)=>({k:'dev',o:v,p:devParent.get(v),from,ic:'v',label:`${devMap.get(v)}  ${v.name}`,kids:[]});
  switch(mode){
  case 'ga':{
    const withC=[...gaMap.keys()].filter(g=>g.comments&&g.comments.length).length;
    const unas=[...gaMap.values()].filter(s=>!linkMap.has(s)).length;
    return [{k:'gafolder',o:S.fComments,ic:'f',label:`${withC}  ${S.fComments.name}`,kids:[]},{k:'gafolder',o:S.fUnassigned,ic:'f',label:`${unas}  ${S.fUnassigned.name}`,kids:[]},
      {k:'garoot',o:S.garoot,ic:'g',label:'Group Addresses',kids:P.mains.map(m=>({k:'main',o:m,p:P.mains,ic:'m',label:`${m.num}  ${m.name}`,kids:m.mids.map(d=>({k:'mid',o:d,p:m.mids,ic:'d',label:`${m.num}/${d.num}  ${d.name}`,kids:d.gas.map(g=>({k:'ga',o:g,p:d.gas,ic:'g',label:`${gaMap.get(g)}  ${g.name}`,kids:[]}))}))}))}];}
  case 'topo':return [{k:'toporoot',o:S.toporoot,ic:'a',label:'Topology',kids:P.topo.areas.map(a=>({k:'area',o:a,p:P.topo.areas,ic:'a',label:`${a.num}  ${a.name}`,kids:a.lines.map(l=>({k:'line',o:l,p:a.lines,ic:'l',label:`${a.num}.${l.num}  ${l.name}`,kids:l.devices.map(v=>dv(v))}))}))}];
  case 'build':{
    const bt=(arr,flt)=>arr.filter(n=>!flt||flt(n)).map(n=>({k:'bnode',o:n,p:arr,ic:'b',label:n.name||'(unnamed)',kids:[...bt(n.kids),...n.devs.map(a=>devByAddr.get(a)).filter(Boolean).map(v=>dv(v,n))]}));
    return [{k:'broot',o:S.broot,ic:'b',label:'Buildings',kids:bt(P.build,n=>!n.trade)},{k:'troot',o:S.troot,ic:'b',label:'Trades',kids:bt(P.build,n=>n.trade)}];}

function searchables(){
  const L=[],add=(kind,o,k,p,panel,fields,extra)=>L.push({kind,o,fields,panel,target:{k,o:extra||o,p},});
  P.mains.forEach(m=>{add('Main group',m,'main',P.mains,'ga',['name','desc']);m.mids.forEach(d=>{add('Middle group',d,'mid',m.mids,'ga',['name','desc']);d.gas.forEach(g=>add('Group address',g,'ga',d.gas,'ga',['name','desc']));});});
  P.topo.areas.forEach(a=>{add('Area',a,'area',P.topo.areas,'topo',['name','desc']);a.lines.forEach(l=>{add('Line',l,'line',a.lines,'topo',['name','desc']);l.devices.forEach(v=>{add('Device',v,'dev',l.devices,'topo',['name','desc']);v.objs.forEach(x=>L.push({kind:'Object',o:x,fields:['name','func'],panel:'topo',target:{k:'dev',o:v,p:l.devices}}));});});});
  const fb=(arr)=>arr.forEach(n=>{add('Building part',n,'bnode',arr,'build',['name','desc']);fb(n.kids);});fb(P.build);
  P.catalog.forEach(c=>add('Catalog product',c,'cat',P.catalog,'catalog',['name','desc']));
  return L;
}
function runFind(){
  const q=findQ.q;findRes=[];if(!q)return;
  const lc=findQ.cs?q:q.toLowerCase();
  searchables().forEach(it=>{
    const fields=it.fields.filter(f=>findQ.scope==='both'||(findQ.scope==='name'?(f==='name'||f==='func'):f==='desc'));
    fields.forEach(f=>{const v=String(it.o[f]||'');if((findQ.cs?v:v.toLowerCase()).includes(lc))findRes.push({kind:it.kind,text:v,item:it,field:f,panel:it.panel,target:it.target});});
  });
}

function opStart(t){const o={id:uid(),title:t,status:'running',time:now()};ops.unshift(o);if(ops.length>60)ops.pop();if(rmode==='pending')renderRight();return o;}
function opEnd(o,st){if(o){o.status=st;}if(rmode==='pending')renderRight();}
let opScan=null,opPa=null;
function act(a,el){
  if(!a)return;
  const NON=['devassoc','ctlw','ctlr','devinfo','devrestart','devtab','chsel','scan','scan2','stopscan','progaddr','gw','gwv','gr','gvw','gvr','readpa','writepa','mpause','mclear','mexp','rexp','rprint','findGo','wsApply','undo1','redo1'];
  if(!NON.includes(a)&&!guard())return;
  let mut=true,label=a;
  switch(a){
  case 'devtab':mut=false;devtab=el.dataset.v;renderCenter();return;
  case 'chsel':mut=false;chsel=+el.dataset.i;renderCenter();return;
  case 'addMain':mut=false;newNumbered('main');return;
  case 'addMid':mut=false;newNumbered('mid');return;
  case 'addGA':mut=false;newNumbered('ga');return;
  case 'addArea':mut=false;newNumbered('area');return;
  case 'addLine':mut=false;newNumbered('line');return;
  case 'addDev':mut=false;newDevice();return;
  case 'addObj':{const owner=sel.o;owner.objs.push({num:(owner.objs.reduce((m,x)=>Math.max(m,x.num),0))+1,name:'New object',func:'',len:'1 bit',flags:'CRWT',dpt:'',prio:'Low',ga:'',links:[]});touch(owner);label='Add group object';break;}
  case 'delObj':sel.o.objs.splice(+el.dataset.i,1);touch(sel.o);label='Delete group object';break;
  case 'addParam':sel.o.params.push({name:'Parameter',value:''});devtab='par';label='Add parameter';break;
  case 'delParam':sel.o.params.splice(+el.dataset.i,1);label='Delete parameter';break;
  case 'conndlg':mut=false;if(isConnected())disconnect();openConn();return;
  case 'addB':mut=false;newBuilding('part');return;
  case 'addFloor':case 'addRoom':case 'addBoard':case 'addCorridor':case 'addStair':case 'addCabinet':mut=false;newBuilding({addFloor:'floor',addRoom:'room',addBoard:'board',addCorridor:'corridor',addStair:'stairway',addCabinet:'cabinet'}[a]);return;
  case 'addBRoot':mut=false;newBuilding('building');return;
  case 'addT':mut=false;newBuilding('trade');return;
  case 'addProd':mut=false;newProduct();return;
  case 'impProd':mut=false;if(guard())$('#pfile').click();return;
  case 'addToLine':{
    const lines=[];P.topo.areas.forEach(a=>a.lines.forEach(l=>lines.push({a,l})));const t=lines[+$('#addline').value];if(!t)return;
    const p=sel.o,dev={name:p.name,desc:'',comments:[],status:'Unknown',serial:'',dl:'',mfr:p.mfr,product:p.name,orderNo:p.orderNo,params:JSON.parse(JSON.stringify(p.params||[])),appId:p.appId||'',channels:(p.channels||[]).slice(),dca:p.dca||'',objs:JSON.parse(JSON.stringify(p.objs)).map((x,i)=>{x.ga='';x.links=[];x.num=i+1;return x;})};
    const o=addTo(t.l.devices,255,dev,1);if(!o)return;
    msg(`Added ${p.name} as ${t.a.num}.${t.l.num}.${o.num}`);label='Add device from catalog';break;}
  case 'assign':{const v=$('#asg').value;if(v&&devByAddr.has(v)&&!sel.o.devs.includes(v))sel.o.devs.push(v);opened.add(sel.o);label='Place device';break;}
  case 'unassign':{const node=sel.k==='bnode'?sel.o:sel.from;if(node)node.devs=node.devs.filter(x=>x!==el.dataset.addr);if(sel.k==='dev')sel=null;label='Remove device from part';break;}
  case 'del':{
    if(!sel||!sel.p)return;
    if(!confirm(`Delete "${sel.o.name}"${sel.k==='ga'||sel.k==='dev'||sel.k==='cat'?'':' and everything inside it'}?`))return;
    sel.p.splice(sel.p.indexOf(sel.o),1);sel=null;cleanup();label='Delete';break;}
  case 'addComment':{const t=$('#cmtext');if(!t||!t.value.trim())return;sel.o.comments.push({text:t.value.trim(),by:ME.id,time:now()});label='Add comment';break;}
  case 'todoNew':case 'todoAdd':{
    let text=a==='todoAdd'?($('#tdtext')||{}).value:null;
    if(a==='todoNew'){rmode='todo';renderRight();setTimeout(()=>{const i=$('#tdtext');if(i)i.focus();},0);return;}
    if(!text||!text.trim())return;P.todos.push({id:uid(),text:text.trim(),done:false,by:ME.id,time:now()});label='Add to-do';break;}
  case 'todoDel':P.todos=P.todos.filter(t=>t.id!==el.dataset.id);label='Delete to-do';break;
  case 'findGo':mut=false;runFind();renderRight();return;
  case 'replaceAll':{
    runFind();if(!findQ.q||!findRes.length)return renderRight();
    if(!confirm(`Replace ${findRes.length} match(es) of "${findQ.q}" with "${findQ.r}"?`))return;
    const re=new RegExp(findQ.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),findQ.cs?'g':'gi');
    findRes.forEach(r=>{r.item.o[r.field]=String(r.item.o[r.field]||'').replace(re,()=>findQ.r);});
    findRes=[];label='Find and replace';break;}
  case 'wsSave':{mut=false;formDlg('Save workspace',[{id:'n',label:'Name',req:1}]).then(r=>{if(!r)return;saveTab();const l=getWs();l.push({name:r.n,fav:favs.slice(),tabs:tabs.map(t=>({panel:t.panel})),ti,left:!$('#ws').classList.contains('noleft'),right:!$('#ws').classList.contains('noright')});localStorage.setItem(wsKey(),JSON.stringify(l));renderRight();msg('Workspace saved.');});return;}

  case 'progaddr':{mut=false;pendingVerify=el.dataset.addr;paFound=[];if(!confirm(`Press the programming button on the device that should become ${pendingVerify} (red LED on), then press OK.`)){pendingVerify=null;return;}if(sendCmd('writepa '+pendingVerify)){opPa=opStart('Program address '+pendingVerify);msg('Address sent, verifying…');}return;}

    let tail=m==='on'?'s 1':m==='off'?'s 0':m==='pct'?encodeVal('5.001',v):m==='temp'?encodeVal('9.001',v):m==='scene'?encodeVal('17.001',v):encodeVal('',v);

  case 'gvr':{mut=false;const ga=$('#gvga').value.trim();if(!/^\d{1,2}\/\d\/\d{1,3}$/.test(ga))return alert('Enter a group address like 1/0/1');sendGroup(`gread ${ga}`);return;}
  case 'mpause':mut=false;paused=!paused;renderCenter();return;

  case 'rprint':mut=false;window.print();return;
  default:return;
  }

    objs:prod?JSON.parse(JSON.stringify(prod.objs)).map((x,i)=>{x.ga='';x.links=[];x.num=i+1;return x;}):[]};
  t.l.devices.push(dev);t.l.devices.sort(byNum);

/* ================= exports ================= */
const SUFFIX=/\s+(status|state|feedback|fb)$/i;
function pairs(){
  const map=new Map();
  for(const g of allGA()){
    if(!(FW[g.dpt]||YT[g.dpt]))continue;
    const isState=SUFFIX.test(g.name),base=g.name.replace(SUFFIX,'').trim(),k=base.toLowerCase()+'|'+g.dpt;
    const e=map.get(k)||{name:base,dpt:g.dpt};
    if(isState)e.state=g.ga;else e.cmd=g.ga;
    map.set(k,e);
  }
  const list=[...map.values()];
  list.forEach(e=>{if(e.dpt!=='1.001'&&e.dpt!=='5.001'&&!e.state){e.state=e.cmd;delete e.cmd;}});
  return list;
}
function exportH(){
  const q=s=>s?`"${s}"`:'nullptr',cs=s=>s.replace(/\\/g,'\\\\').replace(/"/g,'\\"');const used=new Set();
  const lines=pairs().filter(e=>FW[e.dpt]).map(e=>{const id=e.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'entity';let n=id,c=2;while(used.has(n))n=id+'_'+c++;used.add(n);return `  {"${n}", "${cs(e.name)}", ${FW[e.dpt]}, ${q(e.cmd)}, ${q(e.state)}},`;});
  return `// Generated by BusSmith - project: ${P.name}\n// (only 1.001, 5.001 and 9.001 are supported by the gateway firmware)\nstatic Entity entities[] = {\n${lines.join('\n')}\n};\n`;
}
function exportY(){
  const y=s=>JSON.stringify(s);const sec={switch:[],binary_sensor:[],number:[],sensor:[]};
  for(const e of pairs()){
    const head=`    - name: ${y(e.name)}\n`,st=e.state?`      state_address: ${y(e.state)}\n`:'';
    if(e.dpt==='1.001'){if(e.cmd)sec.switch.push(head+`      address: ${y(e.cmd)}\n`+st);else sec.binary_sensor.push(head+st);}
    else if(e.dpt==='5.001'){if(e.cmd)sec.number.push(head+`      address: ${y(e.cmd)}\n`+st+'      type: percent\n');else sec.sensor.push(head+st+'      type: percent\n');}
    else sec.sensor.push(head+st+`      type: ${YT[e.dpt]}\n`);
  }
  let t=`# Generated by BusSmith - project: ${P.name}\nknx:\n`;for(const k of Object.keys(sec))if(sec[k].length)t+=`  ${k}:\n${sec[k].join('')}`;return t;
}
const expGCSV=()=>'group address,name,data type,description\n'+[...gaMap].map(([g,s])=>`${s},${csvq(g.name)},${g.dpt},${csvq(g.desc)}`).join('\n')+'\n';
const expDCSV=()=>'address,name,description,status,serial\n'+[...devMap].map(([v,s])=>`${s},${csvq(v.name)},${csvq(v.desc)},${v.status},${csvq(v.serial)}`).join('\n')+'\n';
function expLCSV(){const r=[];devMap.forEach((s,v)=>v.objs.forEach(x=>[x.ga,...x.links].filter(Boolean).forEach(g=>r.push(`${s},${csvq(v.name)},${csvq(x.name)},${g}`))));return 'device,device name,object,group address\n'+r.join('\n')+'\n';}

      de.querySelectorAll('ParameterInstanceRef').forEach(pi=>{
        if(dv.params.length>=400)return;

    const BTMAP={Building:'building',BuildingPart:'part',Floor:'floor',Room:'room',DistributionBoard:'board',Stairway:'stairway',Corridor:'corridor',Cabinet:'cabinet'};
    const spaceNode=(sp,trade)=>{
      const n={id:uid(),name:sp.getAttribute('Name')||'Space',desc:sp.getAttribute('Description')||'',btype:trade?'trade':(BTMAP[sp.getAttribute('Type')]||'part'),comments:[],kids:[],devs:[],cre:now()};

    if(!confirm(`Import "${NP.name}"?\nThis replaces the current project (you can undo it).`))return;
    P=NP;sel=null;commit('Import '+f.name);renderAll();msg('Imported '+f.name);
  }catch(err){alert('Import failed: '+(err&&err.message?err.message:err));msg('Import failed.');}
};

/* ================= ETS product database / project reader (.knxprod, .vd5, .knxproj) ================= */
const MFRN={'M-0001':'Siemens','M-0002':'ABB','M-0004':'Albrecht Jung','M-0006':'Busch-Jaeger','M-0007':'GIRA','M-0008':'Hager','M-0083':'MDT technologies'};
const xmlOf=async(zip,n)=>{try{const d=new DOMParser().parseFromString(await zip.files[n].async('string'),'application/xml');return d.querySelector('parsererror')?null:d;}catch(e){return null;}};
const dptOf=a=>{const m=(a||'').match(/DPS?T-(\d+)(?:-(\d+))?/);if(!m)return'';const d=m[1]+'.'+String(m[2]||1).padStart(3,'0');return DPT_NAME[d]?d:'';};
function parseApp(doc){
  const ap=doc.querySelector('ApplicationProgram');if(!ap)return null;
  const objById=new Map();doc.querySelectorAll('ComObject').forEach(o=>objById.set(o.getAttribute('Id'),o));
  const mkObj=(ref,o,i)=>{
    const A=n=>{let v=ref?ref.getAttribute(n):null;if(v==null&&o)v=o.getAttribute(n);return v;};
    const num=parseInt(o&&o.getAttribute('Number'),10);
    return {num:isNaN(num)?i+1:num,name:A('Text')||A('Name')||'Object',func:A('FunctionText')||'',len:(A('ObjectSize')||'1 Bit').toLowerCase(),
      flags:(A('CommunicationFlag')!=='Disabled'?'C':'')+(A('ReadFlag')==='Enabled'?'R':'')+(A('WriteFlag')!=='Disabled'?'W':'')+(A('TransmitFlag')==='Enabled'?'T':'')+(A('UpdateFlag')==='Enabled'?'U':''),
      dpt:dptOf(A('DatapointType')),prio:A('Priority')||'Low',ga:'',links:[],channel:''};
  };
  const refMap=new Map();let objs=[],i=0;
  doc.querySelectorAll('ComObjectRef').forEach(r=>{const o=objById.get(r.getAttribute('RefId'));if(!o)return;const x=mkObj(r,o,i++);refMap.set(r.getAttribute('Id'),x);objs.push(x);});
  if(!objs.length)objById.forEach(o=>objs.push(mkObj(null,o,i++)));
  // channels (unique names, in order)
  const chName=new Map(),used=new Map(),channels=[];let cn=0;
  doc.querySelectorAll('Channel').forEach(c=>{
    let t=c.getAttribute('Text')||c.getAttribute('Name')||('Channel '+(++cn));
    const k=(used.get(t)||0)+1;used.set(t,k);if(k>1)t+=' ('+k+')';
    chName.set(c,t);channels.push(t);
  });
  const chOf=el=>{const c=el.closest('Channel');return c?chName.get(c)||'':'';};
  doc.querySelectorAll('Dynamic ComObjectRefRef').forEach(rr=>{const x=refMap.get(rr.getAttribute('RefId'));if(x&&!x.channel)x.channel=chOf(rr);});
  objs.sort((a,b)=>a.num-b.num);objs=objs.slice(0,1500);
  const types=new Map();doc.querySelectorAll('ParameterType').forEach(t=>types.set(t.getAttribute('Id'),[...t.querySelectorAll('Enumeration')].map(e=>[e.getAttribute('Value'),e.getAttribute('Text')||e.getAttribute('Value')])));
  const pById=new Map();doc.querySelectorAll('Parameter').forEach(p=>pById.set(p.getAttribute('Id'),p));
  const prById=new Map();doc.querySelectorAll('ParameterRef').forEach(r=>{const p=pById.get(r.getAttribute('RefId'));if(p)prById.set(r.getAttribute('Id'),{r,p});});
  const meta=new Map();
  const mkParam=id=>{
    const e=prById.get(id);if(!e)return null;const r=e.r,p=e.p;
    if((r.getAttribute('Access')||p.getAttribute('Access'))==='None')return null;
    const text=r.getAttribute('Text')||p.getAttribute('Text');if(!text)return null;
    let val=r.getAttribute('Value');if(val==null)val=p.getAttribute('Value');if(val==null)val='';
    const en=types.get(p.getAttribute('ParameterType'))||[];
    const m=meta.get(id)||{channel:'',group:''};
    const x={name:text,value:val,def:val,channel:m.channel,group:m.group};if(en.length)x.opts=en;return x;
  };
  let params=[];
  doc.querySelectorAll('Dynamic ParameterRefRef').forEach(rr=>{
    const id=rr.getAttribute('RefId');if(meta.has(id))return;
    const chain=[];for(let p=rr.parentElement;p&&p.tagName!=='Dynamic'&&p.tagName!=='Channel';p=p.parentElement){
      if(p.tagName==='ParameterBlock'){const t=p.getAttribute('Text')||p.getAttribute('Name');if(t&&chain[0]!==t)chain.unshift(t);}}
    meta.set(id,{channel:chOf(rr),group:chain.join(' / ')});
    const x=mkParam(id);if(x)params.push(x);
  });
  if(!params.length)prById.forEach((v,id)=>{const x=mkParam(id);if(x)params.push(x);});
  params=params.slice(0,1500);
  return {id:ap.getAttribute('Id'),name:ap.getAttribute('Name')||'',objs,params,channels,refMap,mkParam};
}
async function readEts(zip,R,depth){
  R=R||{prod:new Map(),h2p:new Map(),appPath:new Map(),cache:new Map(),files:[],hasDca:false};depth=depth||0;
  const all=Object.keys(zip.files).filter(n=>!zip.files[n].dir);const nested=[];
  for(const n of all){
    if(depth===0)R.files.push(n);
    const isXml=/\.xml$/i.test(n);
    if((!isXml&&/dca/i.test(n))||/(^|\/)dca[^/]*\//i.test(n))R.hasDca=true;
    if(!isXml){if(depth<2&&/\.(knxprod|zip|vd5|vd4|etsapp)$/i.test(n))nested.push(n);continue;}
    const m=n.match(/(?:^|\/)(M-[0-9A-Fa-f]+)\/([^/]+)$/);if(!m)continue;
    const mfrId=m[1],base=m[2];
    if(/^Hardware\.xml$/i.test(base)){
      const doc=await xmlOf(zip,n);if(!doc)continue;
      doc.querySelectorAll('Hardware').forEach(hw=>{
        let app='';
        hw.querySelectorAll('Hardware2Program').forEach(h=>{const ref=h.querySelector('ApplicationProgramRef');const a=ref?ref.getAttribute('RefId'):'';R.h2p.set(h.getAttribute('Id'),a);if(a)app=a;});
        hw.querySelectorAll('Product').forEach(p=>R.prod.set(p.getAttribute('Id'),{id:p.getAttribute('Id'),mfrId,mfr:MFRN[mfrId]||mfrId,name:p.getAttribute('Text')||hw.getAttribute('Name')||'Product',orderNo:p.getAttribute('OrderNumber')||'',desc:p.getAttribute('VisibleDescription')||'',app}));
      });
    }else if(/_A-.*\.xml$/i.test(base))R.appPath.set(base.replace(/\.xml$/i,''),{zip,n});
  }
  for(const n of nested){try{const z2=await JSZip.loadAsync(await zip.files[n].async('uint8array'));await readEts(z2,R,depth+1);}catch(e){}}
  if(depth===0){
    R.getApp=async id=>{
      if(!id)return null;if(R.cache.has(id))return R.cache.get(id);
      let e=R.appPath.get(id);if(!e){for(const [k,v] of R.appPath)if(k.startsWith(id)||id.startsWith(k)){e=v;break;}}
      let a=null;if(e){const d=await xmlOf(e.zip,e.n);if(d)a=parseApp(d);}
      R.cache.set(id,a);return a;
    };
    R.appOfH2P=id=>R.h2p.get(id)||(id||'').replace(/_H-[^_]+_HP-/,'_A-');
  }
  return R;
}
function pickProducts(list){
  return new Promise(res=>{
    const chosen=new Set(list.length<=5?list.map((_,i)=>i):[]);
    $('#pinfo').textContent=`${list.length} product(s) found. Choose the ones to add to your catalog.`;$('#pfilter').value='';
    const draw=()=>{
      const q=$('#pfilter').value.trim().toLowerCase();
      $('#plist').innerHTML=list.map((p,i)=>({p,i})).filter(({p})=>!q||(p.name+' '+p.orderNo+' '+p.mfr).toLowerCase().includes(q)).slice(0,500)
        .map(({p,i})=>`<label class="prow"><input type="checkbox" data-i="${i}" ${chosen.has(i)?'checked':''} style="display:inline;width:auto"> <b>${esc(p.name)}</b> <span class="mut">${esc(p.orderNo)} · ${esc(p.mfr)}</span></label>`).join('')||'<div class="mut" style="padding:8px">No match.</div>';
      $('#pcount').textContent=chosen.size+' selected';
    };
    $('#plist').onchange=e=>{const i=+e.target.dataset.i;if(e.target.checked)chosen.add(i);else chosen.delete(i);$('#pcount').textContent=chosen.size+' selected';};
    $('#pfilter').oninput=draw;
    $('#pall').onclick=()=>{document.querySelectorAll('#plist input[data-i]').forEach(c=>chosen.add(+c.dataset.i));draw();};
    $('#pnone').onclick=()=>{chosen.clear();draw();};
    const d=$('#pdlg');d.onclose=()=>res(d.returnValue==='ok'?[...chosen].map(i=>list[i]):null);
    draw();d.showModal();
  });
}
$('#pfile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    let zip;try{zip=await JSZip.loadAsync(f);}catch(x){throw 'This file is not a ZIP-based ETS product database. BusSmith reads .knxprod and ZIP-based .vd5 files. If this is an older binary .vd5/.vd4 file, export it from ETS as .knxprod and try again.';}
    msg('Reading product database…');
    const R=await readEts(zip);
    const list=[...R.prod.values()].filter(p=>p.app);
    if(!list.length&&R.files.some(n=>/AddInManifest\.xml$/i.test(n)))throw 'This .etsapp is an ETS add-in (a Windows program, the DCA). It contains no products, parameters or group objects, so there is nothing to import from it.\n\nTo get the product data, import the manufacturer\'s product database (.knxprod) or an ETS project (.knxproj) that contains the device.';
    if(!list.length)throw 'No products were found in this file.\n\nIt contains: '+R.files.slice(0,12).join(', ')+(R.files.length>12?' ...':'')+'\n\nPlease send this list (or the file) so the reader can be adapted.';
    const pick=await pickProducts(list);if(!pick||!pick.length){msg('Nothing imported.');return;}
    let added=0,skipped=0;
    for(const p of pick){
      if(P.catalog.some(c=>c.name===p.name&&c.orderNo===p.orderNo&&c.mfr===p.mfr)){skipped++;continue;}
      const a=await R.getApp(p.app);
      P.catalog.push({id:uid(),mfr:p.mfr,name:p.name,orderNo:p.orderNo,desc:p.desc,comments:[],objs:a?JSON.parse(JSON.stringify(a.objs)):[],params:a?JSON.parse(JSON.stringify(a.params)):[],appId:a?a.id:p.app,channels:a?a.channels.slice():[],dca:(R.hasDca||/dca/i.test(f.name))?f.name:'',cre:now()});added++;
    }
    fix(P);mode='catalog';commit('Import products from '+f.name);index();renderAll();
    msg(`Imported ${added} product(s)${skipped?`, ${skipped} already in the catalog`:''}.`);
  }catch(err){alert('Import failed: '+(err&&err.message?err.message:err));msg('Import failed.');}
};

/* ---- KNX USB (HID) driver: cEMI over USB HID reports ---- */
const gaWord=s=>{const m=String(s).match(/^(\d+)\/(\d+)\/(\d+)$/);return m?((+m[1]&31)<<11)|((+m[2]&7)<<8)|(+m[3]&255):0;};

function usbFmt(dev){
  const out=(dev.collections||[]).flatMap(c=>c.outputReports||[]);
  const o=out.find(x=>x.reportId===1)||out[0];
  if(!o)return {rid:1,len:63};
  const bits=(o.items||[]).reduce((s,i)=>s+i.reportSize*i.reportCount,0);
  return {rid:o.reportId,len:Math.max(16,Math.ceil(bits/8))};
}
function hidInfo(dev){
  const rep=a=>(a||[]).map(r=>'id'+r.reportId+':'+((r.items||[]).reduce((s,i)=>s+i.reportSize*i.reportCount,0)/8)+'B').join(' ');
  const L=[`INFO ${dev.productName} VID ${(dev.vendorId||0).toString(16)} PID ${(dev.productId||0).toString(16)}`];
  (dev.collections||[]).forEach(c=>L.push(`INFO collection usagePage 0x${(c.usagePage||0).toString(16)} usage 0x${(c.usage||0).toString(16)} in[${rep(c.inputReports)}] out[${rep(c.outputReports)}] feature[${rep(c.featureReports)}]`));

let sess=null;const devInfo={};

function sessWait(pred,ms){
  return new Promise(res=>{
    const t0=Date.now(),tick=()=>{
      const i=sess.q.findIndex(pred);
      if(i>=0)return res(sess.q.splice(i,1)[0]);
      if(Date.now()-t0>ms)return res(null);
      sess.w=tick;setTimeout(()=>{if(sess&&sess.w===tick)tick();},60);
    };tick();

async function sessReq(apdu,pred,ms){
  const s=sess,t=[0x40|(s.seq<<2)|apdu[0],...apdu.slice(1)];s.seq=(s.seq+1)&15;

  if(!await usbProbe(m[0],m[1],m[2]))throw new Error(addr+' did not answer. Is it powered and on this line?');
  sess={dst:paWord(m[0],m[1],m[2]),seq:0,q:[],w:null};

async function devInfoRead(addr){
  return devSession(addr,async()=>{

    if(dd){r.mask=(dd[2]<<8)|dd[3];r.maskName=MASKS[r.mask]||'unknown';}

      const x=await sessReq([0x03,0xD5,0,id,0x10,0x01],t=>t.length>=6&&t[1]===0xD6&&t[3]===id);

    const ia=types[1],ib=types[2];
    if(ia==null||ib==null)throw new Error('This device does not expose its address and association tables over the bus (older device type). Use ETS for it.');
    const count=async idx=>{const d=await rd(idx,23,0,1);return d&&d.length>=2?(d[0]<<8)|d[1]:null;};
    const na=await count(ia),nb=await count(ib);
    if(na==null||nb==null)throw new Error('The device did not report its table sizes.');
    const pull=async(idx,n,sz,label)=>{
      const out=[];let k=1,maxc=Math.floor(10/sz);
      while(k<=n){
        if(k%8===1)msg(`Reading ${label}: ${k-1} of ${n}…`);
        const d=await rd(idx,23,k,Math.min(maxc,n-k+1));
        const got=d?Math.floor(d.length/sz):0;
        if(!got){if(maxc>1){maxc=1;continue;}throw new Error('Could not read the '+label+' (entry '+k+' of '+n+').');}
        for(let j=0;j<got&&k+j<=n;j++)out.push(d.slice(j*sz,(j+1)*sz));
        k+=got;
      }
      return out;
    };
    const gas=(await pull(ia,na,2,'address table')).map(e=>(e[0]<<8)|e[1]);
    const pairs=(await pull(ib,nb,4,'association table')).map(e=>({tsap:(e[0]<<8)|e[1],obj:(e[2]<<8)|e[3]}));
    const assoc=pairs.filter(q=>q.tsap>=1&&q.tsap<=na).map(q=>({obj:q.obj,ga:gaStr(gas[q.tsap-1])}));
    return {addr,gas:gas.map(gaStr),assoc};
  });
}
async function devRestart(addr){
  return devSession(addr,async()=>{await usbL(sess.dst,false,[0x40|(sess.seq<<2)|0x03,0x80]);await new Promise(r=>setTimeout(r,400));return true;});
}
function usbCmd(c){
  const p=c.trim().split(/\s+/);
  switch(p[0]){
    case 'scan':usbScan(+p[1],+p[2]);return true;
    case 'stop':scanTok++;return true;
    case 'readpa':usbL(0,true,[0x01,0x00]);setTimeout(()=>handleEvt({evt:'paDone'}),3000);return true;
    case 'writepa':{const m=(p[1]||'').split('.').map(Number),w=paWord(m[0],m[1],m[2]);usbL(0,true,[0x00,0xC0,w>>8,w&255]);setTimeout(()=>handleEvt({evt:'paWritten'}),300);return true;}
    case 'gread':{const g=gaWord(p[1]);if(!g)return false;usbL(g,true,[0x00,0x00]);return true;}
    case 'gwrite':{
      const g=gaWord(p[1]);if(!g)return false;
      if(p[2]==='s')usbL(g,true,[0x00,0x80|((+p[3])&0x3F)]);
      else{const b=[];for(let i=0;i+1<(p[3]||'').length;i+=2)b.push(parseInt(p[3].substr(i,2),16));if(!b.length)return false;usbL(g,true,[0x00,0x80,...b]);}
      return true;}
  }
  return false;
}
async function usbOpen(dev){
  if(!dev.opened)await dev.open();
  dev.addEventListener('inputreport',usbIn);
  usb={dev,name:dev.productName||'KNX USB interface'};
  hidInfo(dev).forEach(l=>usbRaw.push(l));
  // protocol 0x0F: header byte 7 = service (1 Get, 3 Set), body = feature id (+ value)
  await usbSend([0x01,0x00],0x0F,0x01);        // Get supported EMI types (interface answers 04 = cEMI)
  await new Promise(r=>setTimeout(r,150));
  await usbSend([0x05,0x03],0x0F,0x03);        // Set active EMI type = cEMI
  await new Promise(r=>setTimeout(r,200));
  await usbSend([0x05,0x00],0x0F,0x01);        // Get active EMI (log shows what it is)
  await new Promise(r=>setTimeout(r,150));
}
if(navigator.hid)navigator.hid.addEventListener('disconnect',e=>{if(usb&&e.device===usb.dev){usb=null;scanTok++;$('#mconn').textContent='Connect';setG('USB interface unplugged','err');msg('The USB interface was unplugged.');}});

/* ---- "Select Connection" dialog (like ETS) ---- */
const getGws=()=>{try{const a=JSON.parse(localStorage.getItem('nlk.gws')||'null');if(Array.isArray(a))return a;}catch(e){}const o=localStorage.getItem('nlk.gwip');return o?[o]:[];};
const setGws=a=>{try{localStorage.setItem('nlk.gws',JSON.stringify(a));}catch(e){}};
let cdevs=[],csel='';
const hidScore=d=>((d.collections||[]).some(c=>c.usagePage===0xFF01)?4:0)+(/usb|interface|interra|knx/i.test(d.productName||'')?2:0)-(/licen[sc]e|stick|dongle/i.test(d.productName||'')?5:0);
async function listUsb(){
  if(!navigator.hid)return[];
  try{const all=(await navigator.hid.getDevices()).slice().sort((a,b)=>hidScore(b)-hidScore(a));const k=all.filter(d=>hidScore(d)>0);return k.length?k:all;}catch(e){return[];}
}
function renderConn(){
  const row=(key,ic,label,sub)=>`<div class="crow${csel===key?' on':''}" data-c="${esc(key)}"><span class="cic">${ic}</span><b>${esc(label)}</b><span class="mut">${esc(sub||'')}</span></div>`;
  let h='<div class="chead">&#9662; Discovered Interfaces</div>';
  h+=cdevs.length?cdevs.map((d,i)=>row('usb:'+i,'&#9096;',d.productName||'KNX USB interface','USB · VID '+(d.vendorId||0).toString(16)+' PID '+(d.productId||0).toString(16))).join(''):'<div class="mut cnone">No USB interface found yet. Press "Find USB interface…" and pick the Interra / KNX device in the list.</div>';
  h+='<div class="chead">&#9662; Configured Interfaces</div>';
  const g=getGws();h+=g.length?g.map(ip=>row('ws:'+ip,'&#8644;','ESP32 gateway',ip)+'').join(''):'<div class="mut cnone">None. Add an ESP32 gateway below if you use one.</div>';
  $('#clist').innerHTML=h;$('#cok').disabled=!csel;
}
async function openConn(){
  $('#cwarn').textContent=navigator.hid?'':'This browser cannot talk to USB devices. Use the BusSmith desktop app, or Chrome / Edge.';
  cdevs=await listUsb();const g=getGws();csel=cdevs.length?'usb:0':(g[0]?'ws:'+g[0]:'');
  renderConn();$('#cdlg').showModal();$('#cok').focus();
}
$('#clist').onclick=e=>{const r=e.target.closest('[data-c]');if(!r)return;csel=r.dataset.c;renderConn();};
$('#clist').ondblclick=e=>{if(e.target.closest('[data-c]')&&csel)$('#cok').click();};
$('#cfind').onclick=async()=>{
  if(!navigator.hid)return;
  try{const r=await navigator.hid.requestDevice({filters:[]});cdevs=await listUsb();if(r.length){const i=cdevs.findIndex(d=>d===r[0]);csel='usb:'+(i<0?0:i);}$('#cwarn').textContent=cdevs.length?'':'No KNX USB interface was selected.';renderConn();}
  catch(e){$('#cwarn').textContent='Could not list USB devices: '+e.message;}
};
$('#cadd').onclick=()=>{const ip=$('#cip').value.trim();if(!ip)return;const g=getGws();if(!g.includes(ip)){g.push(ip);setGws(g);}csel='ws:'+ip;$('#cip').value='';renderConn();};
$('#cdlg').onclose=()=>{if($('#cdlg').returnValue==='ok'&&csel)connectTo(csel,$('#cuse').checked);};
async function connectTo(key,remember){
  await disconnect();
  if(remember)try{localStorage.setItem('nlk.conn',key);}catch(e){}
  if(key.startsWith('usb:')){
    const d=cdevs[+key.slice(4)]||(await listUsb())[0];
    if(!d)return alert('The USB interface was not found.');
    setG('connecting…');
    try{await usbOpen(d);setG('USB: '+usb.name,'ok');$('#mconn').textContent='Disconnect';msg('Connected to '+usb.name);}
    catch(e){usb=null;setG('USB error','err');alert('Could not open the USB interface: '+e.message+'\n\nClose ETS or any other program that is using the interface, then try again.');}
  }else wsConnect(key.slice(3));
}
async function autoConn(){
  const k=localStorage.getItem('nlk.conn');
  if(k&&k.startsWith('usb:')&&(await listUsb()).length)connectTo('usb:0',false);
}
$('#mconn').onclick=()=>{if(isConnected()){disconnect();msg('Disconnected.');}else openConn();};

function ensureDevice(a,l,d,name){
  const T=P.topo;
  let ar=T.areas.find(x=>x.num===a);if(!ar){ar={num:a,name:'Area '+a,desc:'',comments:[],lines:[]};T.areas.push(ar);T.areas.sort(byNum);}
  let li=ar.lines.find(x=>x.num===l);if(!li){li={num:l,name:`Line ${a}.${l}`,desc:'',comments:[],devices:[]};ar.lines.push(li);ar.lines.sort(byNum);}
  if(li.devices.some(x=>x.num===d))return false;
  li.devices.push({num:d,name:name||`Device ${a}.${l}.${d}`,desc:'',comments:[],status:'Unknown',serial:'',dl:'',mfr:'',product:'',orderNo:'',params:[],objs:[]});li.devices.sort(byNum);return true;
}
function handleEvt(e){
  switch(e.evt){
  case 'progress':$('#sbmsg').textContent='Scanning '+e.addr+'…';break;
  case 'found':{const [a,l,d]=e.addr.split('.').map(Number);scanCount++;if(ensureDevice(a,l,d))scanNew++;commit('Scan: found '+e.addr);renderAll();break;}
  case 'scanDone':msg(`Scan finished: ${scanCount} device(s) answered, ${scanNew} new.`);opEnd(opScan,'done');break;
  case 'scanStopped':msg(`Scan stopped: ${scanCount} device(s) answered so far, ${scanNew} new.`);opEnd(opScan,'stopped');break;
  case 'pa':if(!paFound.includes(e.addr))paFound.push(e.addr);break;
  case 'paWritten':setTimeout(()=>sendCmd('readpa'),500);break;
  case 'paDone':
    if(pendingVerify){
      const want=pendingVerify;pendingVerify=null;
      if(paFound.includes(want)){
        const [a,l,d]=want.split('.').map(Number);
        if(!devByAddr.has(want)){ensureDevice(a,l,d,'Device '+want);commit('Program address '+want);renderAll();}
        msg(`Done: the device now answers as ${want}.`);opEnd(opPa,'done');
      }else{msg(`The device did not confirm ${want}. Check that its programming LED was on, then try again.`);opEnd(opPa,'failed');}
    }else{msg(paFound.length?'Devices in programming mode: '+paFound.join(', '):'No device answered. Press the programming button on a device (LED on) and try again.');opEnd(opPa,'done');}
    break;
  }
}

/* ================= bus monitor ================= */
const MAXLOG=5000;let log=[],paused=false,mfilterVal='';
function bytesOf(t){return (t.data.match(/../g)||[]).map(h=>parseInt(h,16));}
function enrich(t){
  const g=t.group?gaByStr.get(t.dst):null;
  t.name=g?g.name:'';t.type=g&&g.dpt?(DPT_NAME[g.dpt]||g.dpt):'';
  t.value=t.apci==='read'?'':decodeVal(g&&g.dpt,bytesOf(t));
  return t;
}
const devName=a=>{const v=devByAddr.get(a);return v?v.name:'';};
function rowHTML(t){
  const unknown=t.group&&!t.name&&t.dst!=='0/0/0',sn=devName(t.src);
  return `<tr class="${t.dir}"><td>${t.time}</td><td>${t.dir}</td><td>${esc(t.src)}${sn?' · '+esc(sn):''}</td><td>${esc(t.dst)}</td><td>${esc(t.name)}</td><td>${esc(t.type)}</td><td>${esc(t.value)}${t.apci!=='write'?' <i>('+esc(t.apci)+')</i>':''}</td><td>${esc(t.data)}</td><td>${unknown?`<button class="btn" data-add="${esc(t.dst)}" title="Add to project">+</button>`:''}</td></tr>`;
}
const matches=(t,f)=>(!f||(t.src+' '+devName(t.src)+' '+t.dst+' '+t.name+' '+t.value+' '+t.data+' '+t.apci).toLowerCase().includes(f));
const inMon=()=>sel&&sel.k==='dtool'&&(sel.o.id==='gm'||sel.o.id==='bm')&&$('#log');
const wantRow=t=>sel&&sel.o.id==='bm'?true:t.group;
function renderLog(){
  const el=$('#log');if(!el||!sel||sel.k!=='dtool')return;
  log.forEach(enrich);
  const f=mfilterVal.trim().toLowerCase();
  el.innerHTML=log.filter(t=>wantRow(t)&&matches(t,f)).slice(-1000).map(rowHTML).join('');
  $('#mcount').textContent=`${log.length} telegrams`;
  const w=$('#logwrap');w.scrollTop=w.scrollHeight;
}
function pushTelegram(t){
  const d=new Date();t.time=d.toLocaleTimeString([],{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0');
  if(!gaByStr)index();
  enrich(t);log.push(t);if(log.length>MAXLOG)log.shift();
  if(t.group&&(t.apci==='write'||t.apci==='response')){
    live[t.dst]={value:t.value||('raw '+t.data),time:t.time};
    const lv=$('#livev');if(lv&&sel&&sel.k==='ga'&&gaMap.get(sel.o)===t.dst)lv.innerHTML=esc(live[t.dst].value)+' <span class="mut">at '+t.time+'</span>';
  }
  if(paused||!inMon())return;
  const f=mfilterVal.trim().toLowerCase();
  if(wantRow(t)&&matches(t,f)){
    const w=$('#logwrap'),atEnd=w.scrollTop+w.clientHeight>=w.scrollHeight-40;
    $('#log').insertAdjacentHTML('beforeend',rowHTML(t));
    while($('#log').rows.length>1000)$('#log').deleteRow(0);
    if(atEnd)w.scrollTop=w.scrollHeight;
  }
  $('#mcount').textContent=`${log.length} telegrams`;
}
function addUnknownGA(dst){
  if(!guard())return;
  const [a,m,s]=dst.split('/').map(Number);
  formDlg('Add group address '+dst,[{id:'n',label:'Name',req:1}]).then(r=>{
    if(!r)return;
    let main=P.mains.find(x=>x.num===a);if(!main){main={num:a,name:'Main '+a,desc:'',pass:'No',comments:[],mids:[]};P.mains.push(main);P.mains.sort(byNum);}
    let mid=main.mids.find(x=>x.num===m);if(!mid){mid={num:m,name:'Middle '+m,desc:'',pass:'No',comments:[],gas:[]};main.mids.push(mid);main.mids.sort(byNum);}
    if(!mid.gas.some(g=>g.num===s)){mid.gas.push({num:s,name:r.n.trim(),desc:'',dpt:'',comments:[]});mid.gas.sort(byNum);}
    commit('Add group address from bus');renderAll();
  });
}

  Object.values(S).forEach(o=>opened.add(o));
